spring.application.name=xiangqi-backend

# ===================== DATABASE CONFIG =====================
spring.datasource.url=jdbc:postgresql://ep-mute-hill-a1ydxlay-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_ZdVuDW65shQn
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-test-query=SELECT 1

# ===================== JPA & HIBERNATE CONFIG =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable open-in-view
spring.jpa.open-in-view=false

# ===================== SERVER CONFIG (OPTIONAL) =====================
# server.port=8080

# ===================== LOGGING (OPTIONAL) =====================
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate=OFF
# logging.level.org.springframework.web.client.RestTemplate=DEBUG

spring.main.allow-circular-references=true

# ===================== AI ENGINE (Pikafish, UCI) =====================
# Binary + file mạng .nnue tải từ https://github.com/official-pikafish/Pikafish/releases (không commit vào repo).
# Ghi đè bằng biến môi trường AI_ENGINE_PATH, AI_ENGINE_NNUE, ... nếu cài ở chỗ khác.
ai.engine.path=${user.home}/engines/pikafish/Pikafish-Linux-x86-64-universal
ai.engine.nnue=${user.home}/engines/pikafish/pikafish.nnue
# Số tiến trình engine tối đa chạy song song (≈ số core / 2)
ai.engine.pool-size=2
ai.engine.threads=1
ai.engine.hash-mb=32
